# Entorno completo: Postgres+pgvector, Redis, migraciones, API y workers.
#   cp .env.example .env   # completar secretos
#   docker compose up -d --build
#   cp backup.env.example backup.env && docker compose --profile backup up -d   # backups cifrados a S3/GCS
#   docker compose run --rm api node dist/database/seed.js   # alta de la primera inmobiliaria
name: crm-inmobiliario

x-app: &app
  build: .
  image: crm-inmobiliario:latest
  env_file: .env
  environment:
    DATABASE_URL: postgres://crm_app:${CRM_APP_PASSWORD}@postgres:5432/crm
    DATABASE_SYSTEM_URL: postgres://crm_system:${CRM_SYSTEM_PASSWORD}@postgres:5432/crm
    REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  volumes:
    - uploads:/var/lib/crm/uploads
  restart: unless-stopped
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy

services:
  postgres:
    build: ./docker/postgres
    image: crm-postgres:17-pgvector-walg
    # Archivado continuo de WAL (PITR, RPO ≈ 60 s). Ver docker/postgres/backup/.
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=/usr/local/bin/archive-wal.sh %p
      - -c
      - archive_timeout=60
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm_owner
      POSTGRES_PASSWORD: ${CRM_OWNER_PASSWORD}
      CRM_APP_PASSWORD: ${CRM_APP_PASSWORD}
      CRM_SYSTEM_PASSWORD: ${CRM_SYSTEM_PASSWORD}
      BACKUP_REQUIRED: ${BACKUP_REQUIRED:-true}
    # Credenciales de WAL-G separadas del .env de la app (la base no necesita las API keys de LLMs).
    env_file:
      - path: backup.env
        required: false
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_owner -d crm"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  # Backups base diarios (delta/incrementales) cifrados a S3/GCS + retención.
  pg-backup:
    image: crm-postgres:17-pgvector-walg
    command: ["backup-loop.sh"]
    user: postgres
    environment:
      PGHOST: postgres
      PGUSER: crm_owner
      PGPASSWORD: ${CRM_OWNER_PASSWORD}
      PGDATABASE: crm
      PGDATA: /var/lib/postgresql/data
    env_file:
      - path: backup.env
        required: false
    volumes:
      - pgdata:/var/lib/postgresql/data:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["backup"]

  redis:
    image: redis:7.4-alpine
    # AOF + noeviction: BullMQ no tolera que Redis desaloje claves de colas.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    image: crm-inmobiliario:latest
    build: .
    command: ["node", "dist/database/migrate.js"]
    environment:
      DATABASE_OWNER_URL: postgres://crm_owner:${CRM_OWNER_PASSWORD}@postgres:5432/crm
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    command: ["node", "dist/main.js"]
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      retries: 3

  worker:
    <<: *app
    command: ["node", "dist/worker.js"]
    # Escalar con: docker compose up -d --scale worker=3 (los cron son únicos gracias a Job Schedulers en Redis)
    stop_grace_period: 60s

volumes:
  pgdata:
  redisdata:
  uploads:
